[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retreevo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beir>=2.2,<3",
    "haystack-ai>=2.31,<3",
    "thefittest>=0.2.7,<0.3",
]

[project.optional-dependencies]
dev = ["black", "pytest"]
dense = ["sentence-transformers-haystack>=0.1,<1"]
rerank = ["sentence-transformers-haystack>=0.1,<1"]
visualization = ["matplotlib", "networkx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
